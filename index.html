    <script>
      // Gracefully handle browser extension fetch interceptors
      try {
        let currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get: function() { return currentFetch; },
          set: function(val) { currentFetch = val; },
          configurable: true,
          enumerable: true
        });
      } catch (err) {}

      // Prevent chrome extension errors from interrupting app runtime
      window.addEventListener('error', function(e) {
        if (
          (e && e.filename && e.filename.includes('chrome-extension://')) ||
          (e && e.message && e.message.includes('Cannot set property fetch'))
        ) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
